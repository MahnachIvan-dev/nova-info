<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVA Creative Studio — Главная</title>
    <link rel="icon" href="https://i.ibb.co/4gg6XNq1/image.png" type="image/x-icon">

</head>
<body>
    <div class="loader-screen"><div class="loader-ring"></div></div>

    

    <!-- ТОП РЕКЛАМА -->

            <a href="" target="_blank" data-ad>
                <img src="" alt="Top Banner" data-ad-img>
            </a>
        </div>
    </div>

    <div class="page-layout" id="pageLayout">

        <div class="content-wrapper">
            <main class="content">

                    <img data-notfound-img alt="Not Found">
                    <h1>Страница не найдена</h1>
                   <p>Перейдите на информационную страницу</p>
                    <a href="info.html" class="btn-main">Перейти к INFO</a>

            </main>

           
        </div>

        <!-- Правый сайдбар (заполняется из JS) -->
        <aside class="sidebar sidebar-right" data-sidebar="right"></aside>

    </div>

    <script src="js/main.js"></script>
